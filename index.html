<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault — Virtual Cards</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #fff;
    --border: #e3e6eb;
    --text: #0f1729;
    --muted: #667085;
    --accent: #3b3fd8;
    --accent-hover: #2f32b8;
    --accent-soft: #eef0ff;
    --green: #067647; --green-bg: #ecfdf3;
    --amber: #b54708; --amber-bg: #fffaeb;
    --red: #b42318;   --red-bg: #fef3f2;
    --slate: #475467; --slate-bg: #f2f4f7;
    --r: 14px;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
    --nav-h: 62px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

  /* ---------- Layout shell ---------- */
  .app {
    display: grid;
    grid-template-columns: 236px 1fr;
    min-height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 22px 14px;
    display: flex;
    flex-direction: column;
    gap: 26px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .logo {
    display: flex; align-items: center; gap: 9px;
    padding: 0 8px; font-weight: 700; font-size: 16px; letter-spacing: -.01em;
  }
  .logo-mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #7b7ff0);
    display: grid; place-items: center;
    color: #fff; font-size: 12px; font-weight: 800;
  }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav button {
    appearance: none; border: 0; background: transparent;
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 9px;
    color: var(--slate); font-size: 14px; font-weight: 500;
    cursor: pointer; text-align: left; width: 100%;
    transition: background .14s ease, color .14s ease;
  }
  .nav button:hover { background: var(--bg); color: var(--text); }
  .nav button[aria-current="page"] {
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .nav .ico { width: 16px; text-align: center; font-size: 14px; opacity: .9; }
  .side-foot { margin-top: auto; padding: 0 8px; }
  .balance-mini {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 13px;
  }
  .balance-mini span { display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .balance-mini strong { font-size: 19px; letter-spacing: -.02em; }

  /* ---------- Main ---------- */
  .main { padding: 30px 28px 80px; min-width: 0; }
  .head {
    display: flex; flex-wrap: wrap; gap: 14px;
    align-items: flex-start; justify-content: space-between;
    margin-bottom: 26px;
  }
  .head h1 { margin: 0 0 4px; font-size: 23px; letter-spacing: -.02em; }
  .head p { margin: 0; color: var(--muted); font-size: 14px; }

  .btn {
    appearance: none; border: 1px solid transparent; border-radius: 10px;
    padding: 9px 15px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .14s ease, border-color .14s ease, color .14s ease;
    white-space: nowrap;
  }
  .btn--primary { background: var(--accent); color: #fff; }
  .btn--primary:hover { background: var(--accent-hover); }
  .btn--ghost { background: var(--surface); color: var(--slate); border-color: var(--border); }
  .btn--ghost:hover { background: var(--bg); border-color: #d2d6dd; }
  .btn--ghost[aria-pressed="true"] { color: var(--accent); border-color: #c8cbff; background: var(--accent-soft); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Stat row ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 26px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 16px 17px; box-shadow: var(--shadow-sm);
  }
  .stat span { display: block; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  .stat strong { font-size: 21px; letter-spacing: -.02em; }
  .stat small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; }

  /* ---------- CARD GRID: columns + rows ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-rows: auto;
    gap: 18px;
  }
  @media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 720px)  { .grid { grid-template-columns: 1fr; } }

  .ccard {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column;
    transition: box-shadow .16s ease, transform .16s ease;
  }
  .ccard:hover { box-shadow: var(--shadow); }

  .ccard__face {
    position: relative; aspect-ratio: 1.586/1; padding: 16px 18px;
    display: flex; flex-direction: column; justify-content: space-between;
    color: #fff; background: linear-gradient(135deg, #1d2740, #3f4d72);
  }
  .ccard__face[data-brand="mastercard"] { background: linear-gradient(135deg, #26262e, #4c4c5c); }
  .ccard__face[data-brand="amex"]       { background: linear-gradient(135deg, #1b4d88, #3179bd); }
  .ccard.is-frozen  .ccard__face { filter: saturate(.3) brightness(.93); }
  .ccard.is-expired .ccard__face { filter: grayscale(.8) brightness(.9); }

  .face-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .face-label { margin: 0; font-size: 11px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; color: rgba(255,255,255,.72); }
  .brand { font-size: 12.5px; font-weight: 800; letter-spacing: .07em; opacity: .95; }
  .brand--mc { display: flex; }
  .brand--mc i { width: 15px; height: 15px; border-radius: 50%; background: #eb001b; display: block; }
  .brand--mc i + i { background: #f79e1b; margin-left: -6px; mix-blend-mode: screen; }

  .pan {
    margin: 0; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(14px, 3.6vw, 17px); letter-spacing: .08em; white-space: nowrap;
  }
  .pan .mask { opacity: .5; }
  .pan .last4 { font-weight: 600; }

  .face-bot { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .meta-l { display: block; font-size: 9.5px; letter-spacing: .09em;
    text-transform: uppercase; opacity: .62; margin-bottom: 2px; }
  .meta-v { font-size: 12px; font-weight: 600; letter-spacing: .02em; }
  .flag-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.16); border-radius: 999px;
    padding: 4px 9px 4px 7px; font-size: 10.5px; font-weight: 700; letter-spacing: .03em;
  }

  .ccard__foot {
    padding: 12px 14px; display: flex; flex-wrap: wrap; gap: 10px;
    align-items: center; justify-content: space-between;
  }
  .chips { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .status { display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .status--active  { color: var(--green); background: var(--green-bg); }
  .status--frozen  { color: var(--slate); background: var(--slate-bg); }
  .status--expired { color: var(--amber); background: var(--amber-bg); }
  .status--canceled{ color: var(--red);   background: var(--red-bg); }
  .pill-default { font-size: 10px; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase; color: var(--accent); background: var(--accent-soft);
    padding: 3px 7px; border-radius: 6px; }

  .actions { display: flex; gap: 6px; }
  .mini {
    appearance: none; background: transparent; border: 1px solid var(--border);
    color: var(--slate); font-size: 12.5px; font-weight: 600;
    padding: 5px 10px; border-radius: 8px; cursor: pointer;
    transition: background .14s ease, color .14s ease, border-color .14s ease;
  }
  .mini:hover { background: var(--bg); border-color: #d2d6dd; }
  .mini[aria-pressed="true"] { color: var(--accent); border-color: #c8cbff; background: var(--accent-soft); }

  /* ---------- Empty / skeleton ---------- */
  .empty {
    grid-column: 1 / -1; text-align: center; padding: 54px 22px;
    background: var(--surface); border: 1px dashed var(--border);
    border-radius: var(--r); color: var(--muted);
  }
  .empty strong { display: block; color: var(--text); margin-bottom: 4px; font-size: 15px; }
  .sk { border-radius: var(--r); height: 212px;
    background: linear-gradient(90deg,#e9ebef 25%,#f3f4f7 37%,#e9ebef 63%);
    background-size: 400% 100%; animation: sh 1.4s ease infinite; }
  @keyframes sh { 0%{background-position:100% 0} 100%{background-position:0 0} }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

  /* ---------- Tables / lists ---------- */
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .panel-head { padding: 14px 17px; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .panel-head h2 { margin: 0; font-size: 14.5px; letter-spacing: -.01em; }

  .tx { display: flex; align-items: center; gap: 12px; padding: 12px 17px;
    border-bottom: 1px solid var(--border); }
  .tx:last-child { border-bottom: 0; }
  .tx-dot { width: 30px; height: 30px; border-radius: 9px; background: var(--bg);
    display: grid; place-items: center; font-size: 12px; flex: 0 0 auto; }
  .tx-main { flex: 1; min-width: 0; }
  .tx-main b { display: block; font-size: 13.5px; font-weight: 600; }
  .tx-main span { font-size: 12px; color: var(--muted); }
  .tx-amt { font-size: 13.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tx-amt.neg { color: var(--text); }

  .kv { display: flex; justify-content: space-between; gap: 14px; padding: 13px 17px;
    border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .kv:last-child { border-bottom: 0; }
  .kv span { color: var(--muted); }
  .kv b { font-weight: 600; }

  /* ---------- Modal ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(16,24,40,.42);
    display: grid; place-items: center; padding: 20px; z-index: 50;
  }
  .scrim[hidden] { display: none; }
  .modal {
    background: var(--surface); border-radius: 16px; width: min(440px, 100%);
    box-shadow: 0 24px 64px rgba(16,24,40,.24); padding: 22px;
  }
  .modal h2 { margin: 0 0 6px; font-size: 17px; }
  .modal p.lede { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; padding: 9px 11px; font: inherit; font-size: 14px;
    border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
    color: var(--text);
  }
  .modal-foot { display: flex; gap: 9px; justify-content: flex-end; margin-top: 20px; }
  .note { font-size: 12px; color: var(--muted); background: var(--bg);
    border-radius: 9px; padding: 10px 12px; margin-top: 4px; }

  /* ---------- Mobile nav ---------- */
  .mobile-nav { display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { display: none; }
    .main { padding: 22px 16px calc(var(--nav-h) + 40px); }
    .mobile-nav {
      display: grid; grid-template-columns: repeat(4, 1fr);
      position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h);
      background: var(--surface); border-top: 1px solid var(--border); z-index: 40;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .mobile-nav button {
      appearance: none; border: 0; background: transparent; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; font-size: 10.5px; font-weight: 600; color: var(--muted);
    }
    .mobile-nav button[aria-current="page"] { color: var(--accent); }
    .mobile-nav .ico { font-size: 16px; }
    .head .btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="side">
    <div class="logo">
      <span class="logo-mark" aria-hidden="true">V</span>
      Vault
    </div>
    <nav class="nav" aria-label="Main">
      <button data-view="overview" aria-current="page"><span class="ico">▦</span>Overview</button>
      <button data-view="cards"><span class="ico">▭</span>Cards</button>
      <button data-view="activity"><span class="ico">≡</span>Activity</button>
      <button data-view="settings"><span class="ico">⚙</span>Account</button>
    </nav>
    <div class="side-foot">
      <div class="balance-mini">
        <span>Available</span>
        <strong id="sideBalance">$0.00</strong>
      </div>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main" id="main"></main>
</div>

<!-- ============ MOBILE NAV ============ -->
<nav class="mobile-nav" aria-label="Main mobile">
  <button data-view="overview" aria-current="page"><span class="ico">▦</span>Home</button>
  <button data-view="cards"><span class="ico">▭</span>Cards</button>
  <button data-view="activity"><span class="ico">≡</span>Activity</button>
  <button data-view="settings"><span class="ico">⚙</span>Account</button>
</nav>

<!-- ============ NEW CARD MODAL ============ -->
<div class="scrim" id="scrim" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h2 id="mTitle">Create a virtual card</h2>
    <p class="lede">Cards are issued against your verified balance and appear instantly.</p>

    <div class="field">
      <label for="fLabel">Label</label>
      <input id="fLabel" type="text" maxlength="24" placeholder="e.g. Subscriptions" autocomplete="off">
    </div>
    <div class="field">
      <label for="fLimit">Monthly limit (USD)</label>
      <input id="fLimit" type="number" min="1" max="5000" step="1" value="200" inputmode="numeric">
    </div>
    <div class="field">
      <label for="fRegion">Billing region</label>
      <select id="fRegion">
        <option value="US">United States</option>
        <option value="GB">United Kingdom</option>
        <option value="NG">Nigeria</option>
        <option value="DE">Germany</option>
        <option value="CA">Canada</option>
      </select>
    </div>

    <p class="note">Card numbers and CVCs are generated and held by the issuer. This app never sees or stores them.</p>

    <div class="modal-foot">
      <button class="btn btn--ghost" data-close type="button">Cancel</button>
      <button class="btn btn--primary" id="mCreate" type="button">Issue card</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   DATA LAYER  — replace the mock bodies with real fetch calls
   ------------------------------------------------------------
   Required endpoints (all session-authenticated, all scoped
   to the calling cardholder):

     GET    /api/me          -> { name, email, kycStatus, balance }
     GET    /api/cards       -> [{ id, brand, last4, expMonth,
                                   expYear, status, country,
                                   label, isDefault, limit }]
     POST   /api/cards       -> issuer create
     PATCH  /api/cards/:id   -> { status } | { isDefault }
     DELETE /api/cards/:id   -> cancel
     GET    /api/activity    -> [{ id, merchant, amount, cardLast4, date }]

   /api/cards must map from your issuer (Stripe Issuing,
   Lithic, Marqeta). None of those return a PAN or CVC for
   an existing card, and this API must not forward them.
   ============================================================ */

const MOCK = {
  me: { name: 'Alex Rivera', email: 'alex@example.com', kycStatus: 'verified', balance: 482.35 },
  cards: [
    { id:'c1', brand:'visa', last4:'4242', expMonth:9, expYear:2027,
      status:'active', country:'US', label:'Subscriptions', isDefault:true, limit:200 },
    { id:'c2', brand:'mastercard', last4:'8210', expMonth:3, expYear:2026,
      status:'frozen', country:'GB', label:'Travel', isDefault:false, limit:150 },
    { id:'c3', brand:'amex', last4:'0005', expMonth:12, expYear:2025,
      status:'active', country:'NG', label:'Contractors', isDefault:false, limit:400 }
  ],
  activity: [
    { id:'t1', merchant:'Notion Labs', amount:-12.00, cardLast4:'4242', date:'Nov 14' },
    { id:'t2', merchant:'OpenAI',      amount:-20.00, cardLast4:'4242', date:'Nov 12' },
    { id:'t3', merchant:'Balance top-up', amount:250.00, cardLast4:null, date:'Nov 10' },
    { id:'t4', merchant:'Figma',       amount:-15.00, cardLast4:'4242', date:'Nov 08' }
  ]
};

const api = {
  async getMe() {
    // return (await fetch('/api/me', { credentials:'same-origin' })).json();
    await wait(180); return structuredClone(MOCK.me);
  },
  async getCards() {
    // return (await fetch('/api/cards', { credentials:'same-origin' })).json();
    await wait(420); return structuredClone(state.cards);
  },
  async createCard(payload) {
    // return (await fetch('/api/cards', {
    //   method:'POST', headers:{'Content-Type':'application/json'},
    //   credentials:'same-origin', body: JSON.stringify(payload)
    // })).json();
    await wait(650);
    const brand = ['visa','mastercard','amex'][Math.floor(Math.random()*3)];
    const last4 = String(Math.floor(1000 + Math.random()*9000));
    return {
      id: 'c' + Date.now(), brand, last4,
      expMonth: 1 + Math.floor(Math.random()*12), expYear: 2028,
      status: 'active', country: payload.country,
      label: payload.label || 'Virtual card', isDefault: false,
      limit: payload.limit
    };
  },
  async patchCard(id, patch) {
    // return (await fetch(`/api/cards/${id}`, {
    //   method:'PATCH', headers:{'Content-Type':'application/json'},
    //   credentials:'same-origin', body: JSON.stringify(patch)
    // })).json();
    await wait(220);
    const c = state.cards.find(x => x.id === id);
    return Object.assign(c, patch);
  },
  async cancelCard(id) {
    // await fetch(`/api/cards/${id}`, { method:'DELETE', credentials:'same-origin' });
    await wait(260);
    state.cards = state.cards.filter(c => c.id !== id);
    if (state.cards.length && !state.cards.some(c => c.isDefault)) {
      state.cards[0].isDefault = true;
    }
  }
};

const wait = ms => new Promise(r => setTimeout(r, ms));

/* ============================================================
   STATE
   ============================================================ */

const state = {
  view: 'overview',
  loading: true,
  me: null,
  cards: structuredClone(MOCK.cards),
  activity: structuredClone(MOCK.activity),
  busy: new Set()
};

/* ============================================================
   HELPERS
   ============================================================ */

const BRAND = {
  visa:       '<span class="brand">VISA</span>',
  mastercard: '<span class="brand brand--mc" aria-hidden="true"><i></i><i></i></span>',
  amex:       '<span class="brand">AMEX</span>'
};
const STATUS_LABEL = { active:'Active', frozen:'Frozen', expired:'Expired', canceled:'Canceled' };

const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const money = n => (n < 0 ? '-' : '') + '$' +
  Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

const maskPan = last4 =>
  `<span class="mask">•••• •••• ••••</span> <span class="last4">${esc(last4)}</span>`;

const fmtExp = (m, y) => `${String(m).padStart(2,'0')}/${String(y).slice(-2)}`;

function countryFlag(code) {
  if (!/^[A-Za-z]{2}$/.test(code || '')) return '🌐';
  const A = 0x1F1E6;
  return String.fromCodePoint(
    A + code.toUpperCase().charCodeAt(0) - 65,
    A + code.toUpperCase().charCodeAt(1) - 65
  );
}

function isExpired(c) {
  if (c.status === 'expired') return true;
  return new Date(c.expYear, c.expMonth, 1) <= new Date();
}

const effStatus = c => isExpired(c) ? 'expired' : c.status;

/* ============================================================
   ROUTER
   ============================================================ */

const VIEWS = {
  overview: renderOverview,
  cards:    renderCards,
  activity: renderActivity,
  settings: renderSettings
};

function go(view) {
  if (!VIEWS[view]) view = 'overview';
  state.view = view;
  document.querySelectorAll('[data-view]').forEach(b => {
    const on = b.dataset.view === view;
    on ? b.setAttribute('aria-current','page') : b.removeAttribute('aria-current');
  });
  render();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

document.addEventListener('click', e => {
  const navBtn = e.target.closest('[data-view]');
  if (navBtn) { go(navBtn.dataset.view); return; }

  const act = e.target.closest('[data-action]');
  if (act) handleCardAction(act);
});

/* ============================================================
   RENDER ROOT
   ============================================================ */

function render() {
  const main = document.getElementById('main');
  main.innerHTML = VIEWS[state.view]();

  const bal = state.me ? money(state.me.balance) : '—';
  document.getElementById('sideBalance').textContent = bal;

  // wire per-view buttons that need it
  if (state.view === 'cards' || state.view === 'overview') {
    document.querySelectorAll('[data-open-new]').forEach(b =>
      b.addEventListener('click', openModal));
  }
  if (state.view === 'overview') {
    document.querySelectorAll('[data-topup]').forEach(b =>
      b.addEventListener('click', () => alert('Redirect to funding flow (issuer / processor hosted).')));
  }
}

/* ============================================================
   VIEW: OVERVIEW
   ============================================================ */

function renderOverview() {
  const cards = state.cards;
  const active = cards.filter(c => effStatus(c) === 'active').length;
  const frozen = cards.filter(c => effStatus(c) === 'frozen').length;

  return `
    <header class="head">
      <div>
        <h1>Overview</h1>
        <p>${state.me ? `Signed in as ${esc(state.me.email)}` : 'Loading account…'}</p>
      </div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <button class="btn btn--ghost" data-topup type="button">Add funds</button>
        <button class="btn btn--primary" data-open-new type="button">Create a card</button>
      </div>
    </header>

    <section class="stats">
      <div class="stat">
        <span>Available balance</span>
        <strong>${state.me ? money(state.me.balance) : '—'}</strong>
        <small>Spendable across all cards</small>
      </div>
      <div class="stat">
        <span>Active cards</span>
        <strong>${active}</strong>
        <small>${frozen} frozen</small>
      </div>
      <div class="stat">
        <span>Identity status</span>
        <strong style="text-transform:capitalize">${state.me ? esc(state.me.kycStatus) : '—'}</strong>
        <small>${state.me?.kycStatus === 'verified' ? 'Issuance enabled' : 'Verification required'}</small>
      </div>
    </section>

    <header class="head" style="margin-bottom:14px">
      <div><h1 style="font-size:16px">Your cards</h1></div>
      <button class="btn btn--ghost" data-view="cards" type="button"
              style="font-size:13px;padding:6px 12px">View all</button>
    </header>

    <div class="grid">${cards.slice(0,3).map(cardTile).join('') || emptyCards()}</div>

    <header class="head" style="margin:26px 0 14px">
      <div><h1 style="font-size:16px">Recent activity</h1></div>
    </header>
    <div class="panel">${activityRows(state.activity.slice(0,4))}</div>
  `;
}

/* ============================================================
   VIEW: CARDS  — columns and rows
   ============================================================ */

function renderCards() {
  const grid = state.loading
    ? '<div class="sk"></div><div class="sk"></div><div class="sk"></div>'
    : (state.cards.length ? state.cards.map(cardTile).join('') : emptyCards());

  return `
    <header class="head">
      <div>
        <h1>Cards</h1>
        <p>${state.cards.length} card${state.cards.length === 1 ? '' : 's'} issued to your account. Last four digits shown only.</p>
      </div>
      <button class="btn btn--primary" data-open-new type="button">Create a card</button>
    </header>
    <div class="grid">${grid}</div>
  `;
}

function emptyCards() {
  return `<div class="empty">
    <strong>No cards yet</strong>
    Create a virtual card to start spending from your balance.
  </div>`;
}

/* ============================================================
   CARD TILE
   ============================================================ */

function cardTile(c) {
  const st = effStatus(c);
  const busy = state.busy.has(c.id);
  const brand = BRAND[c.brand] || `<span class="brand">${esc(c.brand)}</span>`;

  return `
  <article class="ccard ${st === 'frozen' ? 'is-frozen' : ''} ${st === 'expired' ? 'is-expired' : ''}"
           data-id="${esc(c.id)}"
           aria-label="${esc(c.brand)} card ending ${esc(c.last4)}, ${STATUS_LABEL[st]}">

    <div class="ccard__face" data-brand="${esc(c.brand)}">
      <div class="face-top">
        <p class="face-label">${esc(c.label || 'Virtual card')}</p>
        ${brand}
      </div>

      <p class="pan" aria-label="Card number ending ${esc(c.last4)}">${maskPan(c.last4)}</p>

      <div class="face-bot">
        <div>
          <span class="meta-l">Expires</span>
          <span class="meta-v">${fmtExp(c.expMonth, c.expYear)}</span>
        </div>
        <span class="flag-chip" title="${esc(c.country)}">
          <span aria-hidden="true">${countryFlag(c.country)}</span>${esc(c.country)}
        </span>
      </div>
    </div>

    <div class="ccard__foot">
      <div class="chips">
        <span class="status status--${st}">${STATUS_LABEL[st]}</span>
        ${c.isDefault ? '<span class="pill-default">Default</span>' : ''}
      </div>

      <div class="actions">
        ${st !== 'expired' && st !== 'canceled' ? `
          ${!c.isDefault ? `<button class="mini" data-action="default" type="button" ${busy?'disabled':''}>Default</button>` : ''}
          <button class="mini" data-action="freeze" type="button"
                  aria-pressed="${c.status === 'frozen'}" ${busy?'disabled':''}>
            ${c.status === 'frozen' ? 'Unfreeze' : 'Freeze'}
          </button>` : ''}
        <button class="mini" data-action="cancel" type="button" ${busy?'disabled':''}>Remove</button>
      </div>
    </div>
  </article>`;
}

/* ============================================================
   CARD ACTIONS
   ============================================================ */

async function handleCardAction(btn) {
  const tile = btn.closest('.ccard');
  if (!tile) return;
  const id = tile.dataset.id;
  const card = state.cards.find(c => c.id === id);
  if (!card || state.busy.has(id)) return;

  const action = btn.dataset.action;

  if (action === 'cancel') {
    if (!confirm(`Remove the card ending ${card.last4}? This cannot be undone.`)) return;
    state.busy.add(id);
    render();
    try {
      await api.cancelCard(id);
    } catch (err) {
      console.error(err);
      alert('Could not remove the card. Please try again.');
    } finally {
      state.busy.delete(id);
      render();
    }
    return;
  }

  state.busy.add(id);
  render();
  try {
    if (action === 'freeze') {
      await api.patchCard(id, { status: card.status === 'frozen' ? 'active' : 'frozen' });
    } else if (action === 'default') {
      state.cards.forEach(c => { c.isDefault = false; });
      await api.patchCard(id, { isDefault: true });
    }
  } catch (err) {
    console.error(err);
    alert('Action failed. Please try again.');
  } finally {
    state.busy.delete(id);
    render();
  }
}

/* ============================================================
   VIEW: ACTIVITY
   ============================================================ */

function renderActivity() {
  return `
    <header class="head">
      <div>
        <h1>Activity</h1>
        <p>Transactions across your cards and balance.</p>
      </div>
    </header>
    <div class="panel">${activityRows(state.activity)}</div>
  `;
}

function activityRows(list) {
  if (!list.length) {
    return `<div class="empty"><strong>No activity yet</strong>Transactions will appear here.</div>`;
  }
  return list.map(t => `
    <div class="tx">
      <div class="tx-dot" aria-hidden="true">${t.amount < 0 ? '↑' : '↓'}</div>
      <div class="tx-main">
        <b>${esc(t.merchant)}</b>
        <span>${t.cardLast4 ? `Card •••• ${esc(t.cardLast4)} · ` : ''}${esc(t.date)}</span>
      </div>
      <div class="tx-amt ${t.amount < 0 ? 'neg' : ''}">${money(t.amount)}</div>
    </div>`).join('');
}

/* ============================================================
   VIEW: SETTINGS
   ============================================================ */

function renderSettings() {
  const me = state.me;
  return `
    <header class="head">
      <div><h1>Account</h1><p>Identity and program details.</p></div>
    </header>

    <div class="panel" style="max-width:560px">
      <div class="panel-head"><h2>Profile</h2></div>
      <div class="kv"><span>Name</span><b>${me ? esc(me.name) : '—'}</b></div>
      <div class="kv"><span>Email</span><b>${me ? esc(me.email) : '—'}</b></div>
      <div class="kv"><span>Identity verification</span>
        <b style="text-transform:capitalize;color:${me?.kycStatus === 'verified' ? 'var(--green)' : 'var(--amber)'}">
          ${me ? esc(me.kycStatus) : '—'}
        </b>
      </div>
      <div class="kv"><span>Issuing partner</span><b>Configured server-side</b></div>
    </div>

    <div class="panel" style="max-width:560px;margin-top:16px">
      <div class="panel-head"><h2>Security</h2></div>
      <div class="kv"><span>Card data storage</span><b>None — issuer-held</b></div>
      <div class="kv"><span>Full card numbers</span><b>Never returned to client</b></div>
    </div>
  `;
}

/* ============================================================
   MODAL — create card
   ============================================================ */

const scrim = document.getElementById('scrim');

function openModal() {
  document.getElementById('fLabel').value = '';
  document.getElementById('fLimit').value = '200';
  scrim.hidden = false;
  document.getElementById('fLabel').focus();
}
function closeModal() { scrim.hidden = true; }

scrim.addEventListener('click', e => {
  if (e.target === scrim || e.target.closest('[data-close]')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !scrim.hidden) closeModal();
});

document.getElementById('mCreate').addEventListener('click', async function () {
  const label = document.getElementById('fLabel').value.trim();
  const limit = Number(document.getElementById('fLimit').value) || 100;
  const country = document.getElementById('fRegion').value;

  if (state.me && state.me.kycStatus !== 'verified') {
    alert('Identity verification must be complete before a card can be issued.');
    return;
  }

  this.disabled = true;
  this.textContent = 'Issuing…';
  try {
    const created = await api.createCard({ label, limit, country });
    state.cards.unshift(created);
    closeModal();
    go('cards');
  } catch (err) {
    console.error(err);
    alert('Card could not be issued. Please try again.');
  } finally {
    this.disabled = false;
    this.textContent = 'Issue card';
  }
});

/* ============================================================
   BOOT
   ============================================================ */

(async function init() {
  try {
    state.me = await api.getMe();
    state.cards = await api.getCards();
  } catch (err) {
    console.error(err);
  } finally {
    state.loading = false;
    render();
  }
})();
</script>
</body>
</html>
